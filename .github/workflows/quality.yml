name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Audit, lint, types, regression checks and production image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ori_cruit_ci?schema=public

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install native OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            python3 make g++ pkg-config libcairo2-dev libpango1.0-dev \
            libjpeg-dev libgif-dev librsvg2-dev

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check permission policy
        run: npm run check:permissions

      - name: Run OCR regression checks
        run: npm run check:ocr

      - name: Run broker regression checks
        run: npm run check:broker

      - name: Build production Docker image
        run: docker build --tag ori-cruit-hub:ci --build-arg APP_RELEASE=ci-${GITHUB_SHA} .
