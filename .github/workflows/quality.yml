name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Audit, lint, types, regression checks and production image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ori_cruit_ci?schema=public

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install native OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            python3 make g++ pkg-config libcairo2-dev libpango1.0-dev \
            libjpeg-dev libgif-dev librsvg2-dev

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check permission policy
        run: npm run check:permissions

      - name: Run OCR regression checks
        run: npm run check:ocr

      - name: Run broker regression checks
        run: npm run check:broker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production image once
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          load: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: APP_RELEASE=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=ORI CRUIT HUB production image

      - name: Write immutable release manifest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.image.outputs.digest != ''
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          {
            printf 'WEB_IMAGE=ghcr.io/%s@%s\n' "$GITHUB_REPOSITORY" "$IMAGE_DIGEST"
            printf 'APP_RELEASE=%s\n' "$RELEASE_SHA"
          } > release.env
          cat release.env >> "$GITHUB_STEP_SUMMARY"

      - name: Retain release manifest with this workflow run
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.image.outputs.digest != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-image-release-${{ github.sha }}
          path: release.env
          if-no-files-found: error
          retention-days: 90
